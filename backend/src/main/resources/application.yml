spring:
    application:
        name: lebane-backend

    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5433/lebane_db}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver

    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                format_sql: true

    flyway:
        enabled: true
        locations: classpath:db/migration

    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 55MB

server:
    port: 8080

management:
    endpoints:
        web:
            exposure:
                include: health,info

storage:
    s3:
        endpoint: ${S3_ENDPOINT:http://localhost:4566}
        public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:4566}
        region: ${S3_REGION:us-east-1}
        bucket: ${S3_BUCKET:lebane-images}
        access-key: ${S3_ACCESS_KEY:test}
        secret-key: ${S3_SECRET_KEY:test}

app:
    seed:
        enabled: ${SEED_ENABLED:true}
        department-count: 500
