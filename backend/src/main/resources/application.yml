spring:
    application:
        name: lebane-backend

    datasource:
        url: jdbc:postgresql://localhost:5433/lebane_db
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver

    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                format_sql: true

    flyway:
        enabled: true
        locations: classpath:db/migration

server:
    port: 8080

management:
    endpoints:
        web:
            exposure:
                include: health,info